name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check lint
        run: npm run lint --if-present

      - name: Build Vite app
        run: npm run build